[package]
name = "example-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "example_native"
crate-type = ["cdylib"]

[dependencies]
# The Beacon tag fixes the SDK ABI and the DataFusion version.
beacon-plugin-sdk = { git = "https://github.com/maris-development/beacon", tag = "v2.1.0-rc2" }
# The file format traits are async traits.
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
